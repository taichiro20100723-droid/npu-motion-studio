[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "npu-motion-studio"
version = "0.5.1"
description = "A fast, local image-to-video app for making short, shareable transformations on Intel NPU laptops."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "NPU Motion Studio contributors" }]
keywords = ["npu", "openvino", "intel", "intel-core-ultra", "intel-arc", "image-to-video", "ai-video", "image-morphing", "a-to-b", "motion-brush", "local-ai", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115,<1",
  "fonttools>=4.55,<5",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
openvino = ["openvino>=2025.1"]
production = [
  "huggingface-hub>=0.34,<2",
  "imageio-ffmpeg>=0.6,<1",
  "opencv-python-headless>=4.10,<6",
  "openvino-genai>=2025.4.1,<2026",
  "openvino>=2025.4.1,<2026",
  "sacremoses>=0.1,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.57,<5",
]
dev = [
  "httpx>=0.27,<1",
  "opencv-python-headless>=4.10,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
npu-motion-studio = "npu_motion_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npu_motion_studio"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.json" = "npu_motion_studio/default.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/npu_motion_studio/engines/mock.py" = ["E501"]
