name: Package Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build portable source package
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'npu-ai-video'
          $archive = Join-Path $env:RUNNER_TEMP 'NPU-AI-Video-windows.zip'
          $excluded = @('.git', '.venv', '.runtime', '.pytest_cache', '.ruff_cache')
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Where-Object { $_.Name -notin $excluded } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $staging -Recurse -Force }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive -CompressionLevel Optimal
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach package to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
